# Teste temporário: o runner do GitHub alcança o Grafana? (será removido)
name: Teste de alcance do Grafana
on: workflow_dispatch
jobs:
  alcance:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta autenticada (como o Upptime faz)
        env:
          URL: ${{ secrets.GRAFANA_Q_META_ADS }}
          TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          echo "segredo URL presente: $([ -n "$URL" ] && echo sim || echo NAO) · tamanho ${#URL}"
          echo "segredo TOKEN presente: $([ -n "$TOKEN" ] && echo sim || echo NAO) · tamanho ${#TOKEN}"
          getent ahosts grafana.yoodash.com.br | awk '{print "DNS:", $1}' | sort -u
          for v in 4 6; do
            code=$(curl -$v -sS -m 20 -o body.txt -w "%{http_code} %{time_total}s" -H "Authorization: Bearer $TOKEN" "$URL" 2>err.txt) || true
            echo "IPv$v → $code · erro: $(sed 's#https\?://[^ ]*#<url>#g' err.txt | head -c 160) · valor: $(grep -oE '"value":\[[^]]*\]' body.txt | head -1)"
          done
          code=$(curl -sS -m 20 -o /dev/null -w "%{http_code} %{time_total}s" "$URL" 2>/dev/null) || true
          echo "sem token → $code"
