# Página de status pública da Yoodash (Upptime).
# Repositório PÚBLICO no GitHub da p4c-group; a página sai em https://status.yoodash.com.br
owner: p4c-group
repo: status-yoodash

# Mantém o registro de todas as quedas, inclusive as curtas (por padrão, as de menos de 15 min são apagadas).
skipDeleteIssues: true

# Verificações a cada 5 minutos (o mínimo do GitHub Actions).
# "Lento" (degraded) acima de 5 s; "fora do ar" quando não responde ou responde com erro.
sites:
  - name: Aplicativo
    url: https://app.yoodash.com.br/auth/sign-in
    maxResponseTime: 5000

  - name: API
    url: https://api.yoodash.com.br/health
    maxResponseTime: 5000
    # Só conta como "no ar" se a resposta trouxer o status ok.
    __dangerous__body_down_if_text_missing: '"status":"ok"'

  - name: Formulários e feeds
    url: https://public.yoodash.com.br
    maxResponseTime: 5000
    # A raiz deste domínio responde 404 (ele só serve endereços de formulários e feeds);
    # 404 aqui significa que o servidor está de pé.
    expectedStatusCodes:
      - 200
      - 404

  # --- Sincronização e integrações (workers do sync-engine, via Prometheus/Grafana) ---
  # A URL inteira de cada consulta fica num segredo do repositório ($GRAFANA_Q_*), e o token em $GRAFANA_TOKEN:
  # nos arquivos públicos aparece só o nome do segredo. Não usar `verbose`: ele imprimiria o token no log público.
  # "Ativo" quando a consulta devolve 1 (worker no ar, pronto e com o processamento ligado).
  - name: Sincronização de dados
    url: $GRAFANA_Q_SINCRONIZACAO
    icon: https://status.yoodash.com.br/favicon.ico
    headers:
      - "Authorization: Bearer $GRAFANA_TOKEN"
    __dangerous__body_down_if_regex_missing: '"value":\[\s*[0-9.eE+-]+\s*,\s*"1"\s*\]'
    maxResponseTime: 10000
  - name: Plataformas de e-commerce
    url: $GRAFANA_Q_ECOMMERCE
    icon: https://status.yoodash.com.br/logos/vtex.svg
    headers:
      - "Authorization: Bearer $GRAFANA_TOKEN"
    __dangerous__body_down_if_regex_missing: '"value":\[\s*[0-9.eE+-]+\s*,\s*"1"\s*\]'
    maxResponseTime: 10000
  - name: Mercado Livre
    url: $GRAFANA_Q_MERCADO_LIVRE
    icon: https://status.yoodash.com.br/logos/mercado-livre.svg
    headers:
      - "Authorization: Bearer $GRAFANA_TOKEN"
    __dangerous__body_down_if_regex_missing: '"value":\[\s*[0-9.eE+-]+\s*,\s*"1"\s*\]'
    maxResponseTime: 10000
  - name: Shopee
    url: $GRAFANA_Q_SHOPEE
    icon: https://status.yoodash.com.br/logos/shopee.png
    headers:
      - "Authorization: Bearer $GRAFANA_TOKEN"
    __dangerous__body_down_if_regex_missing: '"value":\[\s*[0-9.eE+-]+\s*,\s*"1"\s*\]'
    maxResponseTime: 10000
  - name: Anymarket
    url: $GRAFANA_Q_ANYMARKET
    icon: https://status.yoodash.com.br/logos/anymarket.svg
    headers:
      - "Authorization: Bearer $GRAFANA_TOKEN"
    __dangerous__body_down_if_regex_missing: '"value":\[\s*[0-9.eE+-]+\s*,\s*"1"\s*\]'
    maxResponseTime: 10000
  - name: Google Ads
    url: $GRAFANA_Q_GOOGLE_ADS
    icon: https://status.yoodash.com.br/logos/google-ads.svg
    headers:
      - "Authorization: Bearer $GRAFANA_TOKEN"
    __dangerous__body_down_if_regex_missing: '"value":\[\s*[0-9.eE+-]+\s*,\s*"1"\s*\]'
    maxResponseTime: 10000
  - name: Meta Ads
    url: $GRAFANA_Q_META_ADS
    icon: https://status.yoodash.com.br/logos/meta-ads.svg
    headers:
      - "Authorization: Bearer $GRAFANA_TOKEN"
    __dangerous__body_down_if_regex_missing: '"value":\[\s*[0-9.eE+-]+\s*,\s*"1"\s*\]'
    maxResponseTime: 10000
  - name: TikTok Ads
    url: $GRAFANA_Q_TIKTOK_ADS
    icon: https://status.yoodash.com.br/logos/tiktok-ads.svg
    headers:
      - "Authorization: Bearer $GRAFANA_TOKEN"
    __dangerous__body_down_if_regex_missing: '"value":\[\s*[0-9.eE+-]+\s*,\s*"1"\s*\]'
    maxResponseTime: 10000
  - name: Google Analytics 4
    url: $GRAFANA_Q_GA4
    icon: https://status.yoodash.com.br/logos/ga4.svg
    headers:
      - "Authorization: Bearer $GRAFANA_TOKEN"
    __dangerous__body_down_if_regex_missing: '"value":\[\s*[0-9.eE+-]+\s*,\s*"1"\s*\]'
    maxResponseTime: 10000
  - name: Google Search Console
    url: $GRAFANA_Q_GOOGLE_SEARCH
